<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7BA428"/>
      <stop offset="100%" stop-color="#556B1B"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5DC"/>
      <stop offset="70%" stop-color="#E8E4D0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B896"/>
      <stop offset="100%" stop-color="#C8A27A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  
  <!-- Main leaf design -->
  <g transform="translate(32, 20)">
    <!-- Central leaf -->
    <path d="M0 4 C-6 2, -8 8, -4 14 C-2 18, 2 18, 4 14 C8 8, 6 2, 0 4z" fill="url(#leaf1)" opacity="0.95"/>
    <!-- Leaf veins -->
    <path d="M0 6 L0 16 M-2 8 L2 12 M2 8 L-2 12" stroke="#D4B896" stroke-width="0.8" opacity="0.7"/>
  </g>
  
  <!-- Side leaves -->
  <g transform="translate(20, 28) rotate(-25)">
    <path d="M0 2 C-4 1, -5 5, -2 8 C-1 10, 1 10, 2 8 C5 5, 4 1, 0 2z" fill="url(#leaf1)" opacity="0.8"/>
  </g>
  <g transform="translate(44, 28) rotate(25)">
    <path d="M0 2 C-4 1, -5 5, -2 8 C-1 10, 1 10, 2 8 C5 5, 4 1, 0 2z" fill="url(#leaf1)" opacity="0.8"/>
  </g>
  
  <!-- Elegant nail accent -->
  <g transform="translate(32, 45)">
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="url(#accent)" opacity="0.9"/>
    <ellipse cx="0" cy="-1" rx="6" ry="2" fill="#F5F5DC" opacity="0.6"/>
  </g>
  
  <!-- Subtle sparkles -->
  <circle cx="24" cy="16" r="1" fill="#F5F5DC" opacity="0.8"/>
  <circle cx="42" cy="38" r="0.8" fill="#E8E4D0" opacity="0.7"/>
  <circle cx="18" cy="48" r="0.6" fill="#D4B896" opacity="0.6"/>
</svg>
